<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pace">
<title>Pace — Run Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#0e0f12;--card:#17191e;--line:#262a31;--txt:#f2f3f5;--mut:#8b919c;--acc:#ff4d2e;--ok:#2ecc71;--warn:#f5a623}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
  header h1{font-size:20px;margin:0;letter-spacing:.5px}
  header h1 span{color:var(--acc)}
  .gps{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:#555}
  .tabs{display:flex;gap:6px}
  .tab{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:6px 12px;border-radius:20px;font-size:13px}
  .tab.on{color:var(--txt);border-color:var(--acc)}
  main{flex:1;display:flex;flex-direction:column;min-height:0}
  #map{flex:1;min-height:180px;margin:0 12px;border-radius:16px;overflow:hidden;background:#1b1d22}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
  .stat{background:var(--card);border-radius:14px;padding:10px 14px}
  .stat.big{grid-column:span 2;text-align:center;padding:14px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
  .val{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .stat.big .val{font-size:56px;line-height:1.05}
  .unit{font-size:14px;color:var(--mut);font-weight:500;margin-left:3px}
  .controls{display:flex;gap:12px;padding:0 12px 14px}
  button.main{flex:1;border:0;border-radius:16px;padding:18px;font-size:18px;font-weight:700;color:#fff;background:var(--acc);position:relative;overflow:hidden}
  button.sec{background:var(--card);border:1px solid var(--line)}
  button.main:active{transform:scale(.98)}
  button.main:disabled{opacity:.4}
  .hold{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.25)}
  .splits{padding:0 12px 10px;max-height:120px;overflow:auto}
  .split{display:flex;justify-content:space-between;font-size:14px;padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .split b{color:var(--acc)}
  #history{display:none;flex:1;overflow:auto;padding:4px 12px 16px}
  .run{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .run .top{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
  .run .row{display:flex;gap:18px;margin-top:6px;font-variant-numeric:tabular-nums}
  .run .row div{font-size:20px;font-weight:700}
  .run .row small{display:block;font-size:11px;color:var(--mut);font-weight:500}
  .run .del{background:none;border:0;color:var(--mut);font-size:13px}
  .empty{color:var(--mut);text-align:center;margin-top:40px}
  .banner{margin:0 12px 8px;padding:8px 12px;border-radius:10px;background:#2a1d10;color:var(--warn);font-size:13px;display:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
  .sheet{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:420px}
  .sheet h2{margin:0 0 12px}
  .sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .leaflet-control-attribution{font-size:9px!important;background:rgba(0,0,0,.5)!important;color:#aaa!important}
  .leaflet-control-attribution a{color:#ccc!important}
</style>
</head>
<body>
<header>
  <h1>PA<span>CE</span></h1>
  <div class="gps"><div class="dot" id="gpsDot"></div><span id="gpsTxt">GPS off</span></div>
  <div class="tabs">
    <button class="tab on" id="tabRun">Run</button>
    <button class="tab" id="tabHist">History</button>
  </div>
</header>

<main id="runView">
  <div class="banner" id="banner"></div>
  <div id="map"></div>
  <div class="stats">
    <div class="stat big"><div class="lbl">Distance</div><div class="val"><span id="dist">0.00</span><span class="unit">km</span></div></div>
    <div class="stat"><div class="lbl">Time</div><div class="val" id="time">0:00</div></div>
    <div class="stat"><div class="lbl">Avg pace</div><div class="val"><span id="avg">–:––</span><span class="unit">/km</span></div></div>
    <div class="stat"><div class="lbl">Current pace</div><div class="val"><span id="cur">–:––</span><span class="unit">/km</span></div></div>
    <div class="stat"><div class="lbl">Last km</div><div class="val"><span id="lastKm">–:––</span></div></div>
  </div>
  <div class="splits" id="splits"></div>
  <div class="controls">
    <button class="main" id="btnStart">START</button>
    <button class="main sec" id="btnStop" style="display:none"><div class="hold" id="holdBar"></div><span>HOLD TO FINISH</span></button>
  </div>
</main>

<section id="history"></section>

<div class="modal" id="summary">
  <div class="sheet">
    <h2>Run complete 🎉</h2>
    <div class="grid">
      <div class="stat"><div class="lbl">Distance</div><div class="val"><span id="sDist"></span><span class="unit">km</span></div></div>
      <div class="stat"><div class="lbl">Time</div><div class="val" id="sTime"></div></div>
      <div class="stat"><div class="lbl">Avg pace</div><div class="val"><span id="sAvg"></span><span class="unit">/km</span></div></div>
      <div class="stat"><div class="lbl">Best km</div><div class="val" id="sBest"></div></div>
    </div>
    <div class="controls" style="padding:0">
      <button class="main sec" id="btnDiscard">Discard</button>
      <button class="main" id="btnSave">Save</button>
    </div>
  </div>
</div>

<script>
// ---------- helpers ----------
const $ = id => document.getElementById(id);
const fmtTime = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; };
const fmtPace = secPerKm => (!isFinite(secPerKm) || secPerKm <= 0 || secPerKm > 3600) ? '–:––' : fmtTime(secPerKm);
function hav(a, b){ const R=6371000, r=Math.PI/180, dLa=(b.lat-a.lat)*r, dLo=(b.lng-a.lng)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const store = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch{ return d; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };
function say(t){ try{ const u = new SpeechSynthesisUtterance(t); u.rate = 1.05; speechSynthesis.speak(u); }catch{} }
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch{} }

// ---------- map ----------
const map = L.map('map', { zoomControl:false, attributionControl:true }).setView([59.91, 10.75], 14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap © CARTO' }).addTo(map);
const route = L.polyline([], { color:'#ff4d2e', weight:5, opacity:.95 }).addTo(map);
const me = L.circleMarker([0,0], { radius:8, color:'#fff', weight:3, fillColor:'#ff4d2e', fillOpacity:1 });
let follow = true; map.on('dragstart', () => follow = false);

// ---------- state ----------
let state = 'idle';            // idle | running | paused
let watchId = null, wakeLock = null, tick = null;
let pts = [];                   // accepted points {lat,lng,t}
let dist = 0, elapsedBefore = 0, segStart = 0;
let splits = [], nextKm = 1000, lastSplitTime = 0;
let lastFix = null;

const elapsed = () => elapsedBefore + (state === 'running' ? (Date.now() - segStart)/1000 : 0);

function setGps(acc){
  const dot = $('gpsDot'), txt = $('gpsTxt');
  if (acc == null){ dot.style.background = '#555'; txt.textContent = 'GPS off'; return; }
  dot.style.background = acc <= 15 ? 'var(--ok)' : acc <= 35 ? 'var(--warn)' : 'var(--acc)';
  txt.textContent = `±${Math.round(acc)} m`;
}
function banner(msg){ const b = $('banner'); b.textContent = msg || ''; b.style.display = msg ? 'block' : 'none'; }

// ---------- GPS ----------
function startGps(){
  if (!('geolocation' in navigator)){ banner('This browser has no GPS access.'); return; }
  if (watchId != null) return;
  watchId = navigator.geolocation.watchPosition(onFix, err => {
    setGps(null);
    banner(err.code === 1 ? 'Location permission denied — allow location for this site in your browser settings.' : 'Waiting for GPS signal…');
  }, { enableHighAccuracy:true, maximumAge:0, timeout:20000 });
}
function onFix(p){
  const c = p.coords, pt = { lat:c.latitude, lng:c.longitude, t:p.timestamp || Date.now(), acc:c.accuracy };
  lastFix = pt; setGps(c.accuracy); banner('');
  me.setLatLng([pt.lat, pt.lng]); if (!map.hasLayer(me)) { me.addTo(map); map.setView([pt.lat, pt.lng], 16); }
  if (follow) map.panTo([pt.lat, pt.lng], { animate:true });
  if (state !== 'running') return;
  if (c.accuracy > 35) return;                      // too noisy
  const prev = pts[pts.length-1];
  if (!prev || prev.newSeg){ pts.push({...pt, seg:true}); route.addLatLng([pt.lat, pt.lng]); return; }
  const d = hav(prev, pt), dt = (pt.t - prev.t)/1000;
  if (d < Math.max(3, c.accuracy/3)) return;          // jitter
  if (dt > 0 && d/dt > 12) return;                    // >43 km/h = glitch
  dist += d; pts.push(pt); route.addLatLng([pt.lat, pt.lng]);
  while (dist >= nextKm){
    const t = elapsed(), splitSec = t - lastSplitTime;
    splits.push(splitSec); lastSplitTime = t; nextKm += 1000;
    buzz([200,100,200]);
    say(`${splits.length} kilometer${splits.length>1?'s':''}. Split ${spoken(splitSec)}. Average pace ${spoken(t/(dist/1000))} per kilometer.`);
    renderSplits();
  }
}
function spoken(s){ s = Math.round(s); const m = Math.floor(s/60), x = s%60; return `${m} minute${m!==1?'s':''} ${x} second${x!==1?'s':''}`; }

function currentPace(){
  if (pts.length < 2) return NaN;
  const now = pts[pts.length-1]; let i = pts.length-1;
  while (i > 0 && now.t - pts[i-1].t <= 25000 && !pts[i].seg) i--;
  let d = 0; for (let k = i+1; k < pts.length; k++) d += hav(pts[k-1], pts[k]);
  const dt = (now.t - pts[i].t)/1000;
  if (d < 15 || dt < 5) return NaN;
  if (Date.now() - now.t > 15000) return NaN;        // standing still / no movement
  return dt / (d/1000);
}

// ---------- wake lock (keeps screen on so tracking doesn't stop) ----------
async function lockScreen(){ try{ if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch{} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state === 'running') lockScreen(); });

// ---------- UI ----------
function render(){
  const t = elapsed();
  $('dist').textContent = (dist/1000).toFixed(2);
  $('time').textContent = fmtTime(t);
  $('avg').textContent = dist > 50 ? fmtPace(t/(dist/1000)) : '–:––';
  $('cur').textContent = state === 'running' ? fmtPace(currentPace()) : '–:––';
  $('lastKm').textContent = splits.length ? fmtTime(splits[splits.length-1]) : '–:––';
}
function renderSplits(){
  const best = Math.min(...splits);
  $('splits').innerHTML = splits.map((s,i) => `<div class="split"><span>Km ${i+1}</span>${s===best && splits.length>1 ? '<b>'+fmtTime(s)+' ★</b>' : '<span>'+fmtTime(s)+'</span>'}</div>`).reverse().join('');
}
function setButtons(){
  const b = $('btnStart');
  b.textContent = state === 'idle' ? 'START' : state === 'running' ? 'PAUSE' : 'RESUME';
  b.style.background = state === 'running' ? '#3a3f48' : 'var(--acc)';
  $('btnStop').style.display = state === 'idle' ? 'none' : 'block';
}

$('btnStart').onclick = () => {
  try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch{}  // unlock audio on iOS
  if (state === 'idle'){
    pts = []; dist = 0; elapsedBefore = 0; splits = []; nextKm = 1000; lastSplitTime = 0;
    route.setLatLngs([]); $('splits').innerHTML = ''; follow = true;
    state = 'running'; segStart = Date.now(); startGps(); lockScreen(); say('Run started');
    tick = setInterval(render, 500);
  } else if (state === 'running'){
    elapsedBefore = elapsed(); state = 'paused'; if (pts.length) pts[pts.length-1].newSeg = true; say('Paused');
  } else {
    state = 'running'; segStart = Date.now(); lockScreen(); say('Resumed');
  }
  buzz(60); setButtons(); render();
};

// hold-to-finish so you don't end a run by accident
let holdT = null, holdStart = 0;
const stopBtn = $('btnStop');
const holdBegin = e => { e.preventDefault(); holdStart = Date.now();
  holdT = setInterval(() => { const f = Math.min(1, (Date.now()-holdStart)/900); $('holdBar').style.width = f*100+'%';
    if (f >= 1){ holdEnd(); finish(); } }, 30); };
const holdEnd = () => { clearInterval(holdT); holdT = null; $('holdBar').style.width = '0'; };
stopBtn.addEventListener('pointerdown', holdBegin); stopBtn.addEventListener('pointerup', holdEnd);
stopBtn.addEventListener('pointerleave', holdEnd); stopBtn.addEventListener('pointercancel', holdEnd);

let pending = null;
function finish(){
  elapsedBefore = elapsed(); state = 'idle'; clearInterval(tick); buzz([100,50,100,50,300]);
  try{ wakeLock && wakeLock.release(); }catch{} wakeLock = null;
  setButtons(); render();
  const t = elapsedBefore, km = dist/1000;
  pending = { date: Date.now(), dist, time: t, splits: [...splits],
              route: pts.filter((_, i) => i % 3 === 0 || i === pts.length-1).map(p => [+p.lat.toFixed(5), +p.lng.toFixed(5)]) };
  $('sDist').textContent = km.toFixed(2); $('sTime').textContent = fmtTime(t);
  $('sAvg').textContent = km > 0.05 ? fmtPace(t/km) : '–:––';
  $('sBest').textContent = splits.length ? fmtTime(Math.min(...splits)) : '–:––';
  $('summary').style.display = 'flex';
  say(`Run complete. ${km.toFixed(2)} kilometers in ${spoken(t)}.`);
}
$('btnSave').onclick = () => { const runs = store.get('runs', []); runs.unshift(pending); store.set('runs', runs); $('summary').style.display = 'none'; };
$('btnDiscard').onclick = () => { $('summary').style.display = 'none'; };

// ---------- history ----------
function renderHistory(){
  const runs = store.get('runs', []), h = $('history');
  if (!runs.length){ h.innerHTML = '<div class="empty">No runs yet.<br>Go get one in 🏃</div>'; return; }
  const total = runs.reduce((a,r) => a + r.dist, 0)/1000;
  h.innerHTML = `<div class="run"><div class="top"><span>All time</span><span>${runs.length} runs</span></div>
    <div class="row"><div>${total.toFixed(1)}<small>km total</small></div><div>${(Math.max(...runs.map(r=>r.dist))/1000).toFixed(2)}<small>longest km</small></div></div></div>` +
    runs.map((r,i) => { const d = new Date(r.date), km = r.dist/1000;
      return `<div class="run"><div class="top"><span>${d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})} · ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
      <button class="del" data-i="${i}">Delete</button></div>
      <div class="row"><div>${km.toFixed(2)}<small>km</small></div><div>${fmtTime(r.time)}<small>time</small></div><div>${km>0.05?fmtPace(r.time/km):'–:––'}<small>/km</small></div></div></div>`; }).join('');
  h.querySelectorAll('.del').forEach(b => b.onclick = () => { const rs = store.get('runs', []); rs.splice(+b.dataset.i, 1); store.set('runs', rs); renderHistory(); });
}
$('tabRun').onclick = () => { $('tabRun').classList.add('on'); $('tabHist').classList.remove('on'); $('runView').style.display = 'flex'; $('history').style.display = 'none'; setTimeout(() => map.invalidateSize(), 50); };
$('tabHist').onclick = () => { $('tabHist').classList.add('on'); $('tabRun').classList.remove('on'); $('runView').style.display = 'none'; $('history').style.display = 'block'; renderHistory(); };

// warn before closing mid-run
window.addEventListener('beforeunload', e => { if (state !== 'idle'){ e.preventDefault(); e.returnValue = ''; } });

// get a GPS lock immediately so you're ready when you hit start
startGps();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
